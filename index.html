    // ==========================================
    // 1. Matrix Dot Grid HTML5 Canvas Background
    // ==========================================
    function MatrixGridCanvas({ rippleIntensity = 1, showControls = false }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        // Size handling
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          initGrid();
        };

        window.addEventListener('resize', handleResize);

        // Grid config
        const spacing = 38; // distance between dots
        let dots = [];
        let ripples = [];

        // Interactive mouse state with smooth interpolation
        const mouse = {
          x: width * 0.5,
          y: height * 0.35,
          targetX: width * 0.5,
          targetY: height * 0.35,
          isHovered: false,
          speed: 0,
        };

        let lastMousePos = { x: mouse.x, y: mouse.y };

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.isHovered = true;

          // Compute cursor speed to create dynamic micro-ripples
          const dx = mouse.targetX - lastMousePos.x;
          const dy = mouse.targetY - lastMousePos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          mouse.speed = Math.min(dist, 40);
          lastMousePos = { x: mouse.targetX, y: mouse.targetY };

          // Add gentle ripple trail on rapid mouse moves
          if (dist > 18 && Math.random() > 0.6) {
            ripples.push({
              x: mouse.targetX,
              y: mouse.targetY,
              radius: 5,
              maxRadius: 180 + Math.random() * 60,
              speed: 3.5,
              strength: 1.0,
              hue: Math.random() > 0.4 ? 'emerald' : 'lime'
            });
          }
        };

        const handleMouseLeave = () => {
          mouse.isHovered = false;
        };

        const handleClick = (e) => {
          const rect = canvas.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const clickY = e.clientY - rect.top;

          // Double ripple blast on click
          ripples.push({
            x: clickX,
            y: clickY,
            radius: 4,
            maxRadius: 360,
            speed: 5.5,
            strength: 1.8,
            hue: 'lime'
          });
          ripples.push({
            x: clickX,
            y: clickY,
            radius: 8,
            maxRadius: 240,
            speed: 3.8,
            strength: 1.2,
            hue: 'emerald'
          });
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('click', handleClick);

        const initGrid = () => {
          dots = [];
          const cols = Math.ceil(width / spacing) + 2;
          const rows = Math.ceil(height / spacing) + 2;

          for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
              dots.push({
                originX: i * spacing,
                originY: j * spacing,
                x: i * spacing,
                y: j * spacing,
                baseRadius: (i % 2 === 0 && j % 2 === 0) ? 1.6 : 1.1,
                noiseOffset: Math.random() * 100,
              });
            }
          }
        };

        initGrid();

        let time = 0;

        const render = () => {
          time += 0.02;

          // Smooth mouse motion lerp
          mouse.x += (mouse.targetX - mouse.x) * 0.08;
          mouse.y += (mouse.targetY - mouse.y) * 0.08;

          // Clear background to deep matte carbon #0d1117
          ctx.fillStyle = '#0d1117';
          ctx.fillRect(0, 0, width, height);

          // Update active ripples
          for (let r = ripples.length - 1; r >= 0; r--) {
            const rip = ripples[r];
            rip.radius += rip.speed;
            rip.strength *= 0.965; // fade out
            if (rip.radius > rip.maxRadius || rip.strength < 0.02) {
              ripples.splice(r, 1);
            }
          }

          // Ambient subtle perspective shift based on mouse relative to center
          const centerX = width * 0.5;
          const centerY = height * 0.5;
          const tiltX = (mouse.x - centerX) / centerX; // -1 to 1
          const tiltY = (mouse.y - centerY) / centerY; // -1 to 1

          // Subtle radial glow under cursor
          const glowGrad = ctx.createRadialGradient(
            mouse.x, mouse.y, 10,
            mouse.x, mouse.y, 350
          );
          glowGrad.addColorStop(0, 'rgba(16, 185, 129, 0.08)');
          glowGrad.addColorStop(0.5, 'rgba(163, 230, 53, 0.03)');
          glowGrad.addColorStop(1, 'rgba(13, 17, 23, 0)');
          ctx.fillStyle = glowGrad;
          ctx.fillRect(0, 0, width, height);

          // Draw Matrix dots
          const mouseInfluenceRadius = 220;
          const mouseInfluenceRadiusSq = mouseInfluenceRadius * mouseInfluenceRadius;

          for (let k = 0; k < dots.length; k++) {
            const dot = dots[k];

            // 1. Perspective offset based on position from center
            const distFromCenterX = dot.originX - centerX;
            const distFromCenterY = dot.originY - centerY;
            const depthFactor = (dot.originY / height) * 0.6 + 0.4; // 3D floor slope feel

            let targetPosX = dot.originX + tiltX * (distFromCenterY * 0.03);
            let targetPosY = dot.originY + tiltY * (distFromCenterX * 0.03);

            // 2. Ambient harmonic wave motion
            const waveX = Math.sin(time + dot.originY * 0.015) * 2;
            const waveY = Math.cos(time + dot.originX * 0.015) * 2;
            targetPosX += waveX;
            targetPosY += waveY;

            // 3. Ripple displacement
            let rippleOffsetStrength = 0;
            let rippleColorBoost = 0;

            for (let r = 0; r < ripples.length; r++) {
              const rip = ripples[r];
              const rdx = targetPosX - rip.x;
              const rdy = targetPosY - rip.y;
              const rdist = Math.sqrt(rdx * rdx + rdy * rdy);
              const diff = Math.abs(rdist - rip.radius);

              if (diff < 45) {
                const waveFactor = Math.sin((diff / 45) * Math.PI);
                const push = (waveFactor * 12 * rip.strength);
                if (rdist > 0.01) {
                  targetPosX += (rdx / rdist) * push;
                  targetPosY += (rdy / rdist) * push;
                }
                rippleOffsetStrength += waveFactor * rip.strength;
                rippleColorBoost += waveFactor * rip.strength * (rip.hue === 'lime' ? 1.5 : 1);
              }
            }

            // 4. Mouse interaction: gentle repulsion & stretch
            const mdx = targetPosX - mouse.x;
            const mdy = targetPosY - mouse.y;
            const mDistSq = mdx * mdx + mdy * mdy;

            let dotRadius = dot.baseRadius;
            let alpha = 0.18;
            let dotColor = '#10b981'; // default emerald

            if (mDistSq < mouseInfluenceRadiusSq) {
              const mDist = Math.sqrt(mDistSq);
              const factor = 1 - mDist / mouseInfluenceRadius; // 1 at center, 0 at edge

              // Repulsion
              const pushDistance = factor * 22;
              targetPosX += (mdx / (mDist || 1)) * pushDistance;
              targetPosY += (mdy / (mDist || 1)) * pushDistance;

              // Size enlargement & brightness
              dotRadius = dot.baseRadius + factor * 2.4;
              alpha = 0.35 + factor * 0.65;

              // Shift color from emerald to bright lime near center
              if (factor > 0.45) {
                dotColor = '#a3e635'; // lime accent
              } else {
                dotColor = '#34d399'; // crisp emerald-light
              }
            }

            // Apply ripple boost
            if (rippleColorBoost > 0) {
              alpha = Math.min(1.0, alpha + rippleColorBoost * 0.7);
              dotRadius += rippleColorBoost * 1.8;
              dotColor = '#bef264'; // neon lime
            }

            // Render Dot
            ctx.beginPath();
            ctx.arc(targetPosX, targetPosY, Math.max(0.6, dotRadius), 0, Math.PI * 2);
            ctx.fillStyle = dotColor;
            ctx.globalAlpha = Math.min(1, Math.max(0.08, alpha));
            ctx.fill();

            // Connect nearby points to mouse cursor if very close (Cyber web effect)
            if (mDistSq < 9000 && mouse.isHovered) {
              const lineAlpha = (1 - Math.sqrt(mDistSq) / 95) * 0.25;
              ctx.strokeStyle = '#10b981';
              ctx.globalAlpha = lineAlpha;
              ctx.lineWidth = 0.75;
              ctx.beginPath();
              ctx.moveTo(targetPosX, targetPosY);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.stroke();
            }
          }

          ctx.globalAlpha = 1.0;
          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('click', handleClick);
        };
      }, [rippleIntensity]);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-auto z-0 w-full h-full"
          style={{ background: '#0d1117' }}
        />
      );
    }

    // ==========================================
    // 2. Floating Frosted-Glass Navigation Bar
    // ==========================================
    function Navbar() {
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

        { name: 'About', href: '#about' },
        { name: 'Projects', href: '#projects' },
        { name: 'Skills', href: '#skills' },
        { name: 'Campus Life', href: '#campus-life' },
        { name: 'Contact', href: '#contact' },
      ];

      useEffect(() => {
        const handleScroll = () => {
          if (window.scrollY > 20) {
            setIsScrolled(true);
          } else {
            setIsScrolled(false);
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <header className="fixed top-0 inset-x-0 z-50 transition-all duration-300 px-4 sm:px-6 lg:px-8 pt-4 pb-2">
          <nav
            className={`max-w-6xl mx-auto transition-all duration-500 rounded-2xl ${
              isScrolled
                ? 'bg-[#0d1117]/85 backdrop-blur-xl border border-emerald-500/30 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.8),0_0_20px_rgba(16,185,129,0.15)] py-2.5 px-4 sm:px-6'
                : 'bg-[#0d1117]/60 backdrop-blur-md border border-emerald-500/20 shadow-[0_4px_24px_rgba(0,0,0,0.4)] py-3 px-5 sm:px-7'
            }`}
          >
            <div className="flex items-center justify-between">
              
              {/* Logo / Name */}
              <a
                href="#"
                className="group flex items-center space-x-2.5 focus:outline-none"
                onClick={() => setActiveLink('Home')}
              >
                <div className="relative flex items-center justify-center w-9 h-9 rounded-xl bg-carbon-850 border border-emerald-500/40 text-emerald-400 group-hover:border-lime-400 group-hover:text-lime-300 transition-all duration-300 shadow-[0_0_15px_rgba(16,185,129,0.25)] group-hover:shadow-[0_0_20px_rgba(163,230,53,0.4)]">
                  <span className="font-mono text-sm font-bold tracking-tighter">SL</span>
                  <span className="absolute -top-1 -right-1 flex h-2.5 w-2.5">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                  </span>
                </div>
                
                <div className="flex flex-col">
                  <span className="font-display font-bold text-base sm:text-lg tracking-wide text-slate-100 group-hover:text-emerald-300 transition-colors">
                    shree lakshmi
                  </span>
                  <span className="text-[10px] font-mono text-emerald-400/80 -mt-1 tracking-wider uppercase flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-lime-400"></span> AIML @ KSIT
                  </span>
                </div>
              </a>

              {/* Desktop Nav Links */}
              <div className="hidden md:flex items-center space-x-1 lg:space-x-2 bg-carbon-950/60 p-1.5 rounded-xl border border-emerald-500/15">
                {navLinks.map((link) => {
                  const isActive = activeLink === link.name;
                  return (
                    <a
                      key={link.name}
                      href={link.href}
                      onClick={() => setActiveLink(link.name)}
                      className={`relative px-3.5 py-1.5 text-xs lg:text-sm font-medium tracking-wide rounded-lg transition-all duration-200 ${
                        isActive
                          ? 'text-lime-300 bg-emerald-950/80 shadow-[0_0_12px_rgba(16,185,129,0.3)] border border-emerald-500/40'
                          : 'text-slate-300 hover:text-emerald-300 hover:bg-emerald-500/10'
                      }`}
                    >
                      {link.name}
                      {isActive && (
                        <span className="absolute bottom-0 left-1/2 -translate-x-1/2 w-4 h-[2px] bg-gradient-to-r from-emerald-400 to-lime-400 rounded-full" />
                      )}
                    </a>
                  );
                })}
              </div>

              {/* Action / Terminal Status Button (Desktop) */}
              <div className="hidden md:flex items-center space-x-3">
                <a
                  href="#contact"
                  className="group relative inline-flex items-center justify-center px-4 py-2 text-xs font-mono font-semibold text-slate-900 bg-gradient-to-r from-emerald-400 via-teal-300 to-lime-400 rounded-xl transition-all duration-300 shadow-[0_0_18px_rgba(16,185,129,0.35)] hover:shadow-[0_0_26px_rgba(163,230,53,0.6)] hover:-translate-y-0.5 active:translate-y-0"
                >
                  <span className="relative flex items-center">
                    Let's Connect
                    <ArrowUpRightIcon />
                  </span>
                </a>
              </div>

              {/* Mobile Menu Button */}
              <div className="flex md:hidden items-center">
                <button
                  type="button"
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  aria-label="Toggle navigation menu"
                  className="p-2 rounded-xl text-slate-300 hover:text-emerald-300 hover:bg-emerald-500/10 border border-emerald-500/20 focus:outline-none transition-colors"
                >
                  {mobileMenuOpen ? <CloseIcon /> : <MenuIcon />}
                </button>

    // ==========================================
    // 5. Interactive 3D Perspective Tilt Project Card
    // ==========================================
    function ProjectCard({ project, onDemoClick, onCodeClick }) {
      const cardRef = useRef(null);
      const [coords, setCoords] = useState({ x: 0, y: 0 });
      const [isHovered, setIsHovered] = useState(false);
      const [glarePos, setGlarePos] = useState({ x: 50, y: 50 });

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // Subtle 3D perspective tilt angles based on mouse position relative to center
        const rotateX = -((y - centerY) / centerY) * 8.5;
        const rotateY = ((x - centerX) / centerX) * 8.5;

        setCoords({ x: rotateX, y: rotateY });
        setGlarePos({
          x: (x / rect.width) * 100,
          y: (y / rect.height) * 100,
        });
      };

      const handleMouseEnter = () => {
        setIsHovered(true);
      };

      const handleMouseLeave = () => {
        setIsHovered(false);
        setCoords({ x: 0, y: 0 });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={{
            transformStyle: 'preserve-3d',
            transform: isHovered
              ? `perspective(1000px) rotateX(${coords.x}deg) rotateY(${coords.y}deg) translateY(-6px) scale3d(1.02, 1.02, 1.02)`
              : 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px) scale3d(1, 1, 1)',
            transition: isHovered
              ? 'transform 0.12s ease-out, border-color 0.3s ease, box-shadow 0.3s ease'
              : 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.5s ease, box-shadow 0.5s ease',
          }}
          className={`relative rounded-2xl p-6 sm:p-7 glass-panel border border-emerald-500/20 overflow-hidden flex flex-col justify-between group cursor-default transition-all duration-300 ${
            isHovered
              ? 'border-emerald-400/50 shadow-[0_16px_36px_-8px_rgba(16,185,129,0.35),0_0_24px_rgba(163,230,53,0.18)]'
              : 'shadow-[0_8px_24px_rgba(0,0,0,0.5)]'
          }`}
        >
          {/* Sleek Shine / Glare Reflection following mouse */}
          <div
            className="pointer-events-none absolute inset-0 z-10 transition-opacity duration-300"
            style={{
              opacity: isHovered ? 0.35 : 0,
              background: `radial-gradient(circle 300px at ${glarePos.x}% ${glarePos.y}%, rgba(163, 230, 53, 0.35), rgba(16, 185, 129, 0.15) 40%, transparent 80%)`,
            }}
          />

          {/* Sleek Diagonal Shine Bar */}
          <div className="pointer-events-none absolute -inset-full top-0 block h-full w-1/2 -skew-x-12 bg-gradient-to-r from-transparent via-emerald-400/15 to-transparent opacity-0 group-hover:opacity-100 group-hover:animate-card-shine" />

          {/* 3D Foreground Content Layer */}
          <div
            style={{ transform: 'translateZ(26px)' }}
            className="relative z-20 flex flex-col h-full justify-between"
          >
            <div>
              {/* Card Top: Category Badge & Index Indicator */}
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center space-x-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-[11px] font-mono px-2.5 py-1 rounded-md bg-carbon-950/90 text-lime-300 border border-emerald-500/30">
                    {project.categoryBadge}
                  </span>
                </div>
                <span className="font-mono text-xs text-emerald-400/70 font-semibold tracking-wider">
                  {project.id}
                </span>
              </div>

              {/* Project Title */}
              <h3 className="font-display font-bold text-xl sm:text-2xl text-slate-100 group-hover:text-emerald-300 transition-colors mb-3">

              {/* 2-Sentence Description */}

                {project.description}
              </p>

              {/* Tech Badges */}

                {project.techBadges.map((badge, idx) => (
                  <span
                    key={idx}
                    className="text-[11px] font-mono px-2.5 py-1 rounded-md bg-carbon-950/90 text-slate-300 border border-emerald-500/20 group-hover:border-emerald-500/40 group-hover:text-emerald-300 transition-colors"

    // ==========================================
    // 11. Cursor Follower Component (Easter Egg)
    // ==========================================
    function CursorFollower() {
      const cursorDotRef = useRef(null);
      const cursorRingRef = useRef(null);
      const [isHovered, setIsHovered] = useState(false);
      const [isVisible, setIsVisible] = useState(false);

      useEffect(() => {
        let mouseX = -100;
        let mouseY = -100;
        let ringX = -100;
        let ringY = -100;
        let animId;

        const handleMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          if (!isVisible) setIsVisible(true);

          if (cursorDotRef.current) {
            cursorDotRef.current.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
          }
        };

        const handleMouseLeave = () => {
          setIsVisible(false);
        };

        const handleMouseEnter = () => {
          setIsVisible(true);
        };

        const render = () => {
          ringX += (mouseX - ringX) * 0.16;
          ringY += (mouseY - ringY) * 0.16;

          if (cursorRingRef.current) {
            cursorRingRef.current.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;
          }
          animId = requestAnimationFrame(render);
        };

        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);
        document.addEventListener('mouseenter', handleMouseEnter);
        animId = requestAnimationFrame(render);

        const handleElementHover = (e) => {
          const target = e.target.closest('a, button, input, textarea, .group, [role="button"]');
          setIsHovered(!!target);
        };
        window.addEventListener('mouseover', handleElementHover);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
          document.removeEventListener('mouseenter', handleMouseEnter);
          window.removeEventListener('mouseover', handleElementHover);
        };
      }, [isVisible]);

      if (!isVisible) return null;

      return (
        <div className="pointer-events-none fixed inset-0 z-50 overflow-hidden hidden md:block">
          {/* Trailing Soft Ambient Glow Ring */}
          <div
            ref={cursorRingRef}
            className={`fixed top-0 left-0 -ml-4 -mt-4 rounded-full border transition-all duration-150 pointer-events-none ${
              isHovered
                ? 'w-10 h-10 border-lime-400/80 bg-emerald-500/10 shadow-[0_0_24px_rgba(163,230,53,0.45)] scale-125'
                : 'w-8 h-8 border-emerald-400/50 bg-emerald-500/5 shadow-[0_0_12px_rgba(16,185,129,0.25)]'
            }`}
            style={{ willChange: 'transform' }}
          />
          {/* Core Center Spark */}
          <div
            ref={cursorDotRef}
            className="fixed top-0 left-0 -ml-1 -mt-1 w-2 h-2 rounded-full bg-lime-300 shadow-[0_0_8px_#a3e635] pointer-events-none"
            style={{ willChange: 'transform' }}
          />
        </div>
      );
    }

    // ==========================================
    // 12. Magnetic Link Helper Component
    // ==========================================
    function MagneticLink({ href, icon: Icon, label, onClick }) {
      const btnRef = useRef(null);
      const [offset, setOffset] = useState({ x: 0, y: 0 });

      const handleMouseMove = (e) => {
        if (!btnRef.current) return;
        const rect = btnRef.current.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = (e.clientX - centerX) * 0.35;
        const dy = (e.clientY - centerY) * 0.35;
        setOffset({ x: dx, y: dy });
      };

      const handleMouseLeave = () => {
        setOffset({ x: 0, y: 0 });
      };

      return (
        <a
          ref={btnRef}
          href={href}
          target={href.startsWith('http') ? '_blank' : undefined}
          rel="noreferrer"
          onClick={onClick}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: `translate(${offset.x}px, ${offset.y}px)`,
            transition: offset.x === 0 ? 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)' : 'transform 0.08s ease-out',
          }}
          className="group relative flex items-center space-x-2.5 px-4 py-2.5 rounded-xl bg-carbon-900/80 hover:bg-carbon-850 border border-emerald-500/20 hover:border-emerald-400 hover:shadow-[0_0_20px_rgba(16,185,129,0.35)] transition-colors text-slate-300 hover:text-white text-xs font-mono select-none"
        >
          <span className="text-emerald-400 group-hover:text-lime-300 transition-colors">
            {Icon && <Icon />}
          </span>
          <span>{label}</span>
        </a>
      );
    }

    }

      return (

            {/* Back to top button */}

            </p>

            {/* Sub-note */}
            <p className="text-[11px] text-slate-500">
              Built with React 18, Tailwind CSS & HTML5 Canvas // KSIT Bengaluru
            </p>

    function App() {

          {/* Interactive Mouse Feature (Easter Egg): Trailing Light Spark */}
          <CursorFollower />

          {/* Fixed Frosted Glass Navigation Bar */}
          <Navbar />

          {/* Complete Main Portfolio Flow */}
          <main>
            <HeroSection />
            <FeaturedProjectsSection />
            <TechStackSkillsSection />
            <EducationCampusJourneySection />
            <ContactSection />
          </main>

          {/* Clean Footer */}
          <FooterSection />
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
